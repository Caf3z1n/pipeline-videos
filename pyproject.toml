[project]
name = "pipeline-videos"
version = "0.1.0"
description = "Pipeline local, retomável e orientado por arquivos para vídeos bíblicos."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.187.0,<3",
  "google-auth-httplib2>=0.2.1,<1",
  "google-auth-oauthlib>=1.2.2,<2",
  "httpx>=0.28.1,<1",
  "pillow>=11.3.0,<12",
  "pydantic>=2.11.7,<3",
  "python-dotenv>=1.1.1,<2",
  "rich>=14.0.0,<15",
  "tzdata>=2025.2",
  "typer>=0.16.0,<1",
]

[project.scripts]
pipeline-videos = "pipeline_videos.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.4.1,<9",
  "pytest-cov>=6.2.1,<7",
  "ruff>=0.12.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_videos"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: executa FFmpeg e pode levar mais tempo",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
