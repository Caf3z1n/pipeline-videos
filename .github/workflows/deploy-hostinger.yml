name: Deploy pipeline-videos na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-videos-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6

      - name: Validar pipeline
        shell: bash
        run: |
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run pytest

      - name: Configurar SSH dedicado
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/pipeline-videos
          chmod 600 ~/.ssh/pipeline-videos
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ativar release na VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/pipeline-videos \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "/home/deploy/pipeline-videos/bin/deploy-from-github '${GITHUB_SHA}'"
